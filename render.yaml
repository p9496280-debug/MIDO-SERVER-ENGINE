services:
  - type: web
    name: mido-server-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mido-server-data
      mountPath: /var/data
      sizeGB: 1
