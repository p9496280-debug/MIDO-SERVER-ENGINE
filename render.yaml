services:
  - type: web
    name: mido-server-engine
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MIDO_SECRET_KEY
        generateValue: true
    disk:
      name: mido-server-data
      mountPath: /var/data
      sizeGB: 1
